; ============================================================
;  PixelHub 75 — выездная сборка (esp32dev_remote)
; ============================================================

[env:esp32dev_remote]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 115200
upload_flags = --no-stub
board_build.filesystem = littlefs
board_build.partitions = partitions_4mb.csv
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++20
    -DESP32_CLASSIC=1
    -DPIXELHUB_REMOTE=1
    -DCORE_DEBUG_LEVEL=0
build_src_filter = +<*> -<audio.cpp> -<radio.cpp> -<radio_screen.cpp> -<radio_spectrum.cpp> -<radio_spectrum_hook.cpp> -<alarm.cpp> -<hourly_chime.cpp>
lib_deps =
    https://github.com/mrcodetastic/ESP32-HUB75-MatrixPanel-DMA.git
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4
    ESP32Async/ESPAsyncWebServer
    ESP32Async/AsyncTCP
    adafruit/Adafruit BME280 Library @ ^2.2.4
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    paulstoffregen/OneWire
    milesburton/DallasTemperature
    knolleary/PubSubClient@^2.8
    adafruit/Adafruit BMP085 Library @ ^1.2.4
    adafruit/Adafruit AHTX0 @ ^2.0.5
    adafruit/Adafruit SGP30 Sensor @ ^2.0.0
    adafruit/RTClib @ ^2.1.4
    dfrobot/DFRobotDFPlayerMini @ ^1.0.6

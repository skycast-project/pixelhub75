<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Звук — PixelHub 75</title><link rel="stylesheet" href="/style.css"></head><body><div class="wrap"><div class="nav"><a href="/">Главная</a><a href="/settings/clock">Часы</a></div><h1>Звук</h1><div class="card"><p class="hint">{{dfStatus}} Файлов: {{dfTracks}}.</p><form method="POST" action="/settings/sound"><label for="vol">Громкость (0–30)</label><input type="number" id="vol" name="vol" min="0" max="30" value="{{vol}}"><label for="voice">Голос</label><select id="voice" name="voice"><option value="0"{{v0}}>Женский</option><option value="1"{{v1}}>Мужской</option><option value="2"{{v2}}>Куранты</option></select><div class="checkbox-row"><input type="checkbox" id="hourly" name="hourly"{{hourly}}><label for="hourly" style="margin:0">Озвучивать время каждый час</label></div><div class="checkbox-row"><input type="checkbox" id="night" name="night"{{night}}><label for="night" style="margin:0">Ночной и утренний звук</label></div><button type="submit">Сохранить</button></form><p class="hint"><a href="/api/df?folder=1&file=1">Ночной</a> | <a href="/api/df?folder=1&file=2">Утренний</a> | <a href="/api/df?folder=12&file=23">Куранты</a> | <a href="/api/df?stop=1">Стоп</a></p></div></div></body></html>
